name: Build Linux AppImage

# Complementa build-mac.yml — mismo patrón, runner nativo por plataforma.
#
# Dos disparos:
#   - workflow_dispatch: sólo produce el artefacto, para probarlo.
#   - push de un tag v*: además PUBLICA al release (draft) de GitHub.
#
# v1.0.1: ver el comentario largo en build-windows.yml — el disparo por tag
# existe porque el auto-updater necesita `latest-linux.yml`, que electron-builder
# genera sólo al publicar, y los `.blockmap` que van con él.
#
# IMPORTANTE: no renombrar los assets a mano después de publicar (el `path:`
# de latest-linux.yml tiene que coincidir byte a byte con el nombre del asset).
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write # necesario para que GITHUB_TOKEN pueda subir los assets

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11.x requires Node >=22.13 (needs node:sqlite)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (publica sólo si el disparo fue un tag)
        run: pnpm run ${{ github.ref_type == 'tag' && 'build:linux:publish' || 'build:linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: tuhua-translator-linux-x64
          path: |
            dist/*.AppImage
            dist/*.blockmap
            dist/latest-linux.yml
          retention-days: 14
