<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuhua OCR Capture Area</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Title bar — OUTSIDE the scan region, sits at the top */
        #title-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            cursor: grab;
            -webkit-app-region: drag;
            z-index: 20;
        }

        #title-bar:active {
            cursor: grabbing;
        }

        #title-bar .left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 1;      /* v3.13.03: Allow left section to shrink when narrow */
            min-width: 0;        /* Allow content to be clipped */
            overflow: hidden;    /* Clip text when there's no space */
        }

        #title-bar .label {
            color: rgba(16, 185, 129, 0.9);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            flex-shrink: 0;      /* Keep label visible as long as possible */
        }

        #title-bar .grip {
            color: rgba(148, 163, 184, 0.5);
            font-size: 10px;
            flex-shrink: 0;      /* Grip icon never shrinks */
        }

        #title-bar .right {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag;
            flex-shrink: 0;      /* v3.13.03: Buttons NEVER shrink — always visible */
        }

        /* Status indicator — NOW IN THE TITLE BAR to avoid overlapping game text.
           v3.13.53: no-drag removed — real bug: nothing in here is
           interactive (just a status dot + text), so marking it no-drag
           only carved out a dead zone in the title bar where dragging
           silently didn't work. It correctly inherits drag from
           #title-bar → .left now, like .grip and .label already did. */
        #status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
            flex-shrink: 1;      /* v3.13.03: Status indicator shrinks first when narrow */
            min-width: 0;        /* Allow clipping */
            overflow: hidden;    /* Clip text when narrow */
        }

        #status-indicator .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #status-indicator .dot.idle { background: #64748b; }
        #status-indicator .dot.capturing { background: #10b981; animation: pulse 1.5s ease-in-out infinite; }
        #status-indicator .dot.paused { background: #eab308; }
        #status-indicator .dot.error { background: #ef4444; }

        #status-indicator #status-text {
            font-size: 9px;
            color: #94a3b8;
            white-space: nowrap;
            letter-spacing: 0.3px;
            flex-shrink: 1;      /* v3.13.03: Status text shrinks/clips when narrow */
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Scan region — the area BELOW the title bar with dashed border.
           This is what indicates the section being scanned for OCR text. */
        #scan-region {
            position: absolute;
            top: 28px;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px dashed rgba(16, 185, 129, 0.7);
            border-radius: 0 0 4px 4px;
            background: rgba(16, 185, 129, 0.03);
        }

        #scan-region.capturing {
            border-color: rgba(16, 185, 129, 0.9);
            background: rgba(16, 185, 129, 0.05);
        }

        #scan-region.paused {
            border-color: rgba(234, 179, 8, 0.6);
            background: rgba(234, 179, 8, 0.03);
        }

        /* Toolbar buttons in title bar */
        .tb-btn {
            width: 22px;
            height: 22px;
            min-width: 22px;     /* v3.13.03: Never shrink below 22px */
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-size: 11px;
            line-height: 1;
            flex-shrink: 0;      /* v3.13.03: Buttons never shrink */
        }

        .tb-btn:hover {
            background: rgba(30, 41, 59, 0.95);
            color: #e2e8f0;
            border-color: rgba(16, 185, 129, 0.5);
        }

        .tb-btn.pause-btn.paused {
            border-color: rgba(234, 179, 8, 0.5);
            color: #eab308;
        }

        .tb-btn.pause-btn.paused:hover {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
        }

        /* Resize handles */
        .resize-handle {
            position: absolute;
            z-index: 5;
        }

        .resize-handle.top-left { top: 24px; left: -4px; width: 12px; height: 12px; cursor: nw-resize; }
        .resize-handle.top-right { top: 24px; right: -4px; width: 12px; height: 12px; cursor: ne-resize; }
        .resize-handle.bottom-left { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: sw-resize; }
        .resize-handle.bottom-right { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: se-resize; }
        .resize-handle.top { top: 24px; left: 20px; right: 20px; height: 8px; cursor: n-resize; }
        .resize-handle.bottom { bottom: -4px; left: 20px; right: 20px; height: 8px; cursor: s-resize; }
        .resize-handle.left { top: 48px; left: -4px; bottom: 20px; width: 8px; cursor: w-resize; }
        .resize-handle.right { top: 48px; right: -4px; bottom: 20px; width: 8px; cursor: e-resize; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Title bar — above the scan region, NOT part of what OCR captures.
         Status indicator is now here to avoid overlapping game text. -->
    <div id="title-bar">
        <div class="left">
            <span class="grip">⠿</span>
            <span class="label">OCR</span>
            <!-- Status indicator moved into title bar.
                 v3.13.50: starts on "Escaneo pausado" — see the
                 isScanPaused=true default below, this just matches it. -->
            <div id="status-indicator">
                <span class="dot paused"></span>
                <span id="status-text">Escaneo pausado</span>
            </div>
        </div>
        <div class="right">
            <button class="tb-btn pause-btn paused" id="btn-pause" title="Pausar/Reanudar escaneo" onclick="toggleScan()">▶</button>
            <button class="tb-btn" id="btn-capture" title="Capturar ahora" onclick="manualCapture()">📸</button>
        </div>
    </div>

    <!-- v3.13.50: no close ("✕") button here anymore — real bug: closing
         this window from here left no way to reopen it short of pausing
         and resuming all of Tuhua. Pausing scan (⏸/▶ above) is the
         actual "I don't want this running right now" control; the
         window itself is meant to persist for the OCR session, closed
         only by the backend (switching input method away from OCR, or
         Tuhua pausing) — see closeCaptureArea() call sites in
         window-manager.js/ipc-handlers.js. -->

    <!-- Scan region — dashed border indicates the section being scanned for OCR text.
         Starts "paused" (yellow) to match isScanPaused=true below. -->
    <div id="scan-region" class="paused">
        <!-- Resize Handles -->
        <div class="resize-handle top-left" data-dir="nw"></div>
        <div class="resize-handle top-right" data-dir="ne"></div>
        <div class="resize-handle bottom-left" data-dir="sw"></div>
        <div class="resize-handle bottom-right" data-dir="se"></div>
        <div class="resize-handle top" data-dir="n"></div>
        <div class="resize-handle bottom" data-dir="s"></div>
        <div class="resize-handle left" data-dir="w"></div>
        <div class="resize-handle right" data-dir="e"></div>
    </div>

    <script>
        const api = window.tuhuaOverlay;
        // v3.13.50: starts true — the capture area (and the backend
        // scanning loop behind it, see _startOcrCapture in
        // ipc-handlers.js) always opens paused now, so the user has a
        // chance to reposition the region before anything gets scanned.
        let isScanPaused = true;

        // ===== TOGGLE SCAN PAUSE/RESUME =====
        function toggleScan() {
            if (api && api.ocrToggleScan) {
                api.ocrToggleScan().then(result => {
                    if (result && result.success) {
                        isScanPaused = !result.scanning;
                        const btn = document.getElementById('btn-pause');
                        const region = document.getElementById('scan-region');

                        if (isScanPaused) {
                            btn.textContent = '▶';
                            btn.classList.add('paused');
                            region.classList.add('paused');
                            region.classList.remove('capturing');
                            updateStatus('paused', 'Escaneo pausado');
                        } else {
                            btn.textContent = '⏸';
                            btn.classList.remove('paused');
                            region.classList.remove('paused');
                            updateStatus('idle', 'Escaneando');
                        }
                    }
                });
            }
        }

        // ===== MANUAL CAPTURE =====
        function manualCapture() {
            updateStatus('capturing', 'Capturando...');
            if (api && api.ocrCapture) {
                api.ocrCapture().then(result => {
                    if (result && result.success) {
                        updateStatus(isScanPaused ? 'paused' : 'idle', isScanPaused ? 'Escaneo pausado' : 'Escaneando');
                    } else {
                        updateStatus('error', 'Error al capturar');
                        setTimeout(() => updateStatus(isScanPaused ? 'paused' : 'idle', isScanPaused ? 'Escaneo pausado' : 'Escaneando'), 2000);
                    }
                }).catch(() => {
                    updateStatus('error', 'Error');
                    setTimeout(() => updateStatus(isScanPaused ? 'paused' : 'idle', isScanPaused ? 'Escaneo pausado' : 'Escaneando'), 2000);
                });
            }
        }

        // ===== STATUS UPDATE =====
        function updateStatus(state, text) {
            const indicator = document.getElementById('status-indicator');
            const dot = indicator.querySelector('.dot');
            const statusText = document.getElementById('status-text');

            dot.className = 'dot ' + state;
            statusText.textContent = text;
        }

        // ===== LISTEN FOR EVENTS FROM MAIN PROCESS =====
        if (api) {
            api.onShortcut((data) => {
                if (data.action === 'ocr-status') {
                    if (data.state === 'recognizing') {
                        if (!isScanPaused) {
                            updateStatus('capturing', 'Reconociendo...');
                        }
                    } else if (data.state === 'ready' || data.state === 'auto-capturing') {
                        if (!isScanPaused) {
                            updateStatus('idle', 'Escaneando');
                        }
                    } else if (data.state === 'error') {
                        updateStatus('error', 'Error');
                    }
                }
            });
        }

        // Initialize status — matches isScanPaused=true above.
        updateStatus('paused', 'Escaneo pausado');
    </script>
</body>
</html>
