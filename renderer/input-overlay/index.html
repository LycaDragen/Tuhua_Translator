<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Input Overlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
        }
        #box {
            background-color: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px 8px 0 8px;
            color: #ccc;
            padding: 10px 14px;
            height: 100vh;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }
        .drag-area {
            -webkit-app-region: drag;
            height: 18px;
            min-height: 18px;
            cursor: move;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 4px;
        }
        #text-content {
            flex: 1;
            overflow-y: auto;
            word-break: break-word;
            scrollbar-width: none;
        }
        #text-content::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="box">
        <div class="drag-area"></div>
        <div class="label">INPUT</div>
        <div id="text-content" style="font-size: 14px;">Waiting for text...</div>
    </div>
    <script>
        const overlay = window.tuhuaOverlay;
        if (overlay) {
            overlay.onInputText((data) => {
                document.getElementById('text-content').innerText = data.text || '';
            });

            overlay.onStyleUpdate((data) => {
                if (data.fontSize) {
                    document.getElementById('text-content').style.fontSize = data.fontSize + 'px';
                }
                if (data.fontFamily) {
                    const font = data.fontFamily === 'automatic'
                        ? "'Segoe UI', 'Noto Sans JP', 'Noto Sans SC', sans-serif"
                        : data.fontFamily;
                    document.getElementById('text-content').style.fontFamily = font;
                }
                if (data.theme === 'light') {
                    document.getElementById('box').style.backgroundColor = 'rgba(255, 255, 255, 0.85)';
                    document.getElementById('box').style.color = '#333';
                    document.getElementById('box').style.borderColor = 'rgba(0, 0, 0, 0.1)';
                } else if (data.theme === 'dark') {
                    document.getElementById('box').style.backgroundColor = 'rgba(0, 0, 0, 0.55)';
                    document.getElementById('box').style.color = '#ccc';
                    document.getElementById('box').style.borderColor = 'rgba(255, 255, 255, 0.12)';
                }
                if (data.opacity !== undefined) {
                    const base = data.theme === 'light' ? '255,255,255' : '0,0,0';
                    document.getElementById('box').style.backgroundColor = `rgba(${base}, ${data.opacity / 100})`;
                }
            });
        }
    </script>
</body>
</html>
